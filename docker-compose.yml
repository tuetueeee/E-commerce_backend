version: '3.8'

services:
  # --- PostgreSQL Server ---
  postgres:
    image: postgres:16-alpine
    container_name: local_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- Giao diện pgAdmin (Thêm cái này) ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: local_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com  # Tài khoản đăng nhập pgAdmin
      PGADMIN_DEFAULT_PASSWORD: admin         # Mật khẩu đăng nhập pgAdmin
    ports:
      - "5050:80"     # Chạy ở cổng 5050
    depends_on:
      - postgres

volumes:
  postgres_data: